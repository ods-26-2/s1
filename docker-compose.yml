# Ambiente LOCAL para testar o S1 com um Kafka de verdade, sem usar o
# broker compartilhado da nuvem (e sem gastar os créditos da turma).
#
#   docker compose up -d --build        # Kafka local + tópicos + S1
#   python simulate.py --kafka localhost:9092   # publica a demonstração e confere as saídas
#   docker compose logs s1              # o que o S1 registrou
#   docker compose down                 # desliga tudo
#
# Do computador, o broker fica em localhost:9092; dentro do compose, em kafka:19092.
services:
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:19092", "--list"]
      interval: 2s
      retries: 30

  topicos:
    image: apache/kafka:3.9.1
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["sh", "-c"]
    command:
      - >
        for t in ods.i2.tracks ods.i3.calibration ods.session.started ods.artifact.published
        ods.s1.position ods.s1.zone_transition ods.s1.zone_occupancy; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic $$t --partitions 3;
        done

  s1:
    build: .
    depends_on: { topicos: { condition: service_completed_successfully } }
    environment:
      S1_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      S1_ZONES_FILE: /app/data/zones_a3.json
      S1_ZONES_VERSION: zones-a3-1
      # Só no teste local: lê o que já estava no tópico antes do S1 subir.
      S1_KAFKA_AUTO_OFFSET_RESET: earliest
